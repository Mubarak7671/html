<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Assignments</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f4f4f4;
        }
        h2 { margin-top: 40px; }
        button {
            margin-top: 10px;
            padding: 8px 15px;
            border: none;
            background: #333;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover { background: #555; }
        pre {
            background: white;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>JavaScript Assignments Output</h1>
    <pre id="output">Click any button to see output...</pre>
    <script>
        const out = (msg) => document.getElementById("output").textContent = msg;
        // 1. Second largest
        function secondLargest() {
            let arr = [10, 20, 4, 45, 99];
            let unique = [...new Set(arr)];
            unique.sort((a, b) => b - a);    
            out("Second Largest: " + unique[1]);
        }
        // 2. First non-repeating character
        function firstNonRepeating() {
            let str = "aabbcdeff";
            for (let char of str) {
                if (str.indexOf(char) === str.lastIndexOf(char)) {
                    out("First Non-Repeating: " + char);
                    return;
                }
            }
            out("No unique character");
        }
        // 3. Rotate array
        function rotateArray() {
            let arr = [1, 2, 3, 4, 5];
            let k = 2;
            k = k % arr.length;
            let rotated = arr.slice(-k).concat(arr.slice(0, -k));
            out("Rotated Array: " + JSON.stringify(rotated));
        }
        // 4. Flatten array
        function flattenArray() {
            let arr = [1, [2, [3, 4]], 5];
            out("Flattened: " + JSON.stringify(arr.flat(Infinity)));
        }
        // 5. Custom map
        function customMap() {
            Array.prototype.myMap = function(callback) {
                let result = [];
                for (let i = 0; i < this.length; i++) {
                    result.push(callback(this[i], i, this));
                }
                return result;
            };
            out("Custom Map: " + [1,2,3].myMap(x => x * 3));
        }
        // 6. Debounce
        function showDebounce() {
            function debounce(fn, delay) {
                let timer;
                return function(...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn.apply(this, args), delay);
                };
            }
            out("Debounce Function Created ✔");
        }
        // 7. Throttle
        function showThrottle() {
            function throttle(fn, limit) {
                let flag = true;
                return function(...args) {
                    if (flag) {
                        fn.apply(this, args);
                        flag = false;
                        setTimeout(() => flag = true, limit);
                    }
                };
            }
            out("Throttle Function Created ✔");
        }
        // 8. Deep clone object
        function deepCloneObj() {
            let obj = { a: 1, b: { c: 2 } };
            let clone = JSON.parse(JSON.stringify(obj));
            out("Deep Clone: " + JSON.stringify(clone));
        }
        // 9. Counter using closure
        function counter() {
            function createCounter() {
                let count = 0;
                return function() {
                    return ++count;
                };
            }
            let c = createCounter();
            out("Counter: " + c() + ", " + c());
        }
        // 10. Object to key-value pairs
        function objToPairs() {
            let obj = { a: 1, b: 2 };
            out(JSON.stringify(Object.entries(obj)));
        }
        // 11. Group by key
        function groupByKey() {
            let data = [
                { name: "A", grade: "A" },
                { name: "B", grade: "B" },
                { name: "C", grade: "A" }
            ];
            let grouped = data.reduce((acc, obj) => {
                let key = obj.grade;
                (acc[key] = acc[key] || []).push(obj);
                return acc;
            }, {});
            out(JSON.stringify(grouped, null, 2));
        }
        // 12. Remove falsy values
        function removeFalsyValues() {
            let arr = [0, 1, false, 2, '', 3, null, undefined];
            out("Truthy Values: " + arr.filter(Boolean));
        }
        // 13. Longest word
        function longestWord() {
            let sentence = "JavaScript is an awesome language";
            let words = sentence.split(" ");
            let longest = words.reduce((a, b) => b.length > a.length ? b : a);
            out("Longest Word: " + longest);
        }
        // 14. Reverse words split("separate ")-break the string into array of words reverse()-array reverse join(" ")-combine array back into a string.
        function reverseWords() {
            let str = "I love JavaScript";
            out("Reversed Words: " + str.split(" ").reverse().join(" "));
        }//out("Reversed Words - this sends final out put.")
        // 15. Merge sorted arrays
        function mergeSorted() {
            let a = [1,3,5];
            let b = [2,4,6];
            let result = [];
            let i = 0, j = 0;
            while (i < a.length && j < b.length) {
                if (a[i] < b[j]) result.push(a[i++]);
                else result.push(b[j++]);
            }
            result = result.concat(a.slice(i)).concat(b.slice(j));
            out("Merged Array: " + JSON.stringify(result));
        }
    </script>
    <h2>Click to Run Each Assignment</h2>
    <button onclick="secondLargest()">1. Second Largest</button><br>
    <button onclick="firstNonRepeating()">2. First Non-Repeating</button><br>
    <button onclick="rotateArray()">3. Rotate Array</button><br>
    <button onclick="flattenArray()">4. Flatten Array</button><br>
    <button onclick="customMap()">5. Custom Map</button><br>
    <button onclick="showDebounce()">6. Debounce Function</button><br>
    <button onclick="showThrottle()">7. Throttle Function</button><br>
    <button onclick="deepCloneObj()">8. Deep Clone</button><br>
    <button onclick="counter()">9. Counter (Closure)</button><br>
    <button onclick="objToPairs()">10. Object to Pairs</button><br>
    <button onclick="groupByKey()">11. Group Objects</button><br>
    <button onclick="removeFalsyValues()">12. Remove Falsy</button><br>
    <button onclick="longestWord()">13. Longest Word</button><br>
    <button onclick="reverseWords()">14. Reverse Words</button><br>
    <button onclick="mergeSorted()">15. Merge Sorted Arrays</button><br>
</body>
</html>
